# Polymarket Up/Down momentum bot — configuration
# Every value here is a starting hypothesis from the wallet teardowns. Tune it from paper results.

mode = "shadow"                 # "paper" = simulated fills
                               # "shadow" = real account + real decisions, orders NOT sent (safe dry run)
                               # "live" = real orders; start with `python manage.py run --live`
                               # shadow/live read keys from .env (see .env.example) and write to data_live/

[account]
starting_equity = 200.0        # USD — paper only. Live uses your real portfolio balance at the first start

[markets]
assets = ["btc"]               # btc, eth, sol, xrp, bnb, doge (each needs a Chainlink + Coinbase feed)
timeframe = "5m"               # 5m | 15m | 1h | 4h

[feeds]
coinbase = true                # fast spot feed (leading indicator)
ca_bundle = "certs/system_ca.pem"  # optional extra roots; ignored if missing. macOS on a TLS-inspecting network: `python manage.py certs`
relax_x509_strict = true       # Python 3.13 rejects some corporate CAs; chain is still verified

[model]
twap_lookback_s = 60           # markets settle on Chainlink 60s TWAP (end) vs 60s TWAP (start)
vol_halflife_s = 600           # EWMA half-life for per-second volatility
vol_change_s = 30              # measure vol from 30 s changes (Chainlink is smoothed; 1 s changes understate vol ~2x)
vol_prior_bp = 0.5             # display only until ~5.5 min of Chainlink data: the bot does NOT trade on this prior
vol_floor_bp = 0.2             # absolute floor, basis points per second
vol_restore_max_age_s = 0      # 0 = measure volatility fresh on every restart (~5.5 min, no trading meanwhile); e.g. 900 = reuse if < 15 min old
max_spot_adjust_sigma = 3.0    # cap how far a Coinbase move can shift the Chainlink estimate (x sigma·√lag)
basis_sigma_usd = 4.0          # uncertainty of our Chainlink-now estimate (USD)

[strategy]
momentum_window_s = 3          # the signal both bots profit from
min_momentum_bp = 0.5          # coin must have moved >= this toward the side we buy
min_edge = 0.02                # $/share required after the taker fee
max_edge = 0.12                # skip bigger "edges": when model and market disagree that much, the model is usually wrong
max_momentum_bp = 5.0          # skip 3-second moves bigger than this (single-exchange spikes); 0 = off
min_price = 0.20               # skip long shots: buys under 20¢ lost money in both analysed wallets and in live shadow
max_price = 0.95
min_seconds_left = 5           # don't send orders in the last N seconds
min_seconds_elapsed = 3        # wait for the start reference to be known
max_book_age_s = 2.0           # skip if the book hasn't updated recently
side_cooldown_s = 2.0          # min gap between orders on the same side of a market
max_orders_per_market = 30

[execution]
latency_ms = 700               # paper: re-read the book this long after the signal (live measured ~0.6 s, first order 2 s)
liquidity_haircut = 0.5        # paper: assume only this fraction of displayed size is really available
max_slippage = 0.05            # limit = ask + this, but never above fair − fee − min_edge (edge stays protected)
fee_rate = 0.07                # crypto taker fee: rate × shares × p × (1 − p)

[risk]
clip_pct_equity = 0.05         # each order risks this share of equity  → scales as equity grows
min_shares = 5                 # Polymarket minimum order size
max_clip_usd = 250             # hard cap per order (USD)
max_shares_per_order = 5       # hard cap per order (shares); 0 = no cap. Can't be below min_shares (5)
max_market_usd = 12            # max total spent in one market incl. fees and in-flight orders; 0 = no cap
max_market_exposure_pct = 0.25 # also cap each market at this share of equity (the lower cap wins)
daily_loss_stop_pct = 0.50     # stop opening positions for the rest of the UTC day once today's loss reaches this…
daily_loss_stop_basis = "initial"  # …share of starting capital ("initial": 50% × $200 = $100/day) or of equity at 00:00 UTC ("day_start")
max_drawdown_kill_pct = 0.35   # halt the bot if equity falls this far below its peak

[rebates]
estimate_taker_rebates = true  # credit paper taker rebates by tier (from paper volume), paid at UTC midnight

[live]                         # used by mode = "shadow" and "live"
data_dir = "data_live"         # separate ledger from paper trading
sync_every_s = 15              # balance sync (equity = pUSD cash + positions). Keep < 30: it also keeps the order connection warm
redeem_winnings = true         # claim resolved winnings automatically (proxy/Safe/deposit wallets need a Relayer API key)
cancel_all_on_start = true     # cancel resting orders at start and shutdown (the bot itself never leaves any)
order_timeout_s = 10           # give up waiting for an order response after this (then checks for fills)
max_consecutive_errors = 5     # halt new orders after this many order errors in a row
max_orders_per_minute = 20
min_cash_usd = 5               # don't open positions while pUSD cash is below this
require_confirmation = false   # true = also type LIVE at startup (--yes skips it)

[logging]
data_dir = "data"              # relative to this file
snapshot_every_s = 1.0         # 1 Hz market snapshots for later tuning/replay
status_every_s = 15
